plugins {
    id 'com.android.application'
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

android {
    namespace 'com.maarouf.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.maarouf.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.0.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs("$rootDir/../dist")
        }
    }
}
